<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>writing - torben.sh</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500&family=DM+Mono:wght@300;400&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <style>
            body {
                font-family: "IBM Plex Mono", monospace;
            }
            .font-dm {
                font-family: "DM Mono", monospace;
            }
            .link-item {
                font-family: "IBM Plex Mono", monospace;
                font-size: 11px;
                color: #a5a3a0;
                text-decoration: none;
                letter-spacing: 0.08em;
                transition: color 0.15s;
                display: flex;
                align-items: center;
            }
            .link-item::before {
                content: "_";
                opacity: 0;
                margin-right: 2px;
                transition: opacity 0.15s;
            }
            .link-item:hover::before {
                opacity: 1;
            }
            .link-item:hover {
                color: #1a1816;
            }
            .post-link {
                font-family: "IBM Plex Mono", monospace;
                font-size: 12px;
                color: #1a1816;
                text-decoration: none;
                letter-spacing: 0.02em;
                transition: color 0.15s;
            }
            .post-link:hover {
                color: #6b6965;
            }
        </style>
    </head>
    <body class="bg-[#f5f4f0] text-[#1a1816] min-h-screen flex flex-col">
        <main
            class="flex-1 flex flex-col justify-center px-10 md:px-20 lg:px-32 py-16 max-w-4xl w-full"
        >
            <div class="mb-12">
                <a href="/" class="link-item mb-8 inline-flex">← torben.sh</a>
                <h1
                    class="font-dm font-light text-7xl md:text-8xl tracking-tight leading-none mt-8"
                >
                    writing
                </h1>

                <p class="mt-4">A collection of my thoughts</p>
            </div>

            <div class="border-t border-black/[0.07] mb-12"></div>

            <div id="all-posts" class="flex flex-col gap-5">
                <!-- populated by script -->
            </div>
        </main>

        <script>
            fetch("/posts.json")
                .then((r) => r.json())
                .then((posts) => {
                    const container = document.getElementById("all-posts");
                    posts.forEach((post) => {
                        const row = document.createElement("div");
                        row.style.cssText =
                            "display:flex;align-items:baseline;justify-content:space-between";
                        row.innerHTML = `
                            <a href="/blog/${post.slug}.html" class="post-link">${post.title}</a>
                            <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:#a5a3a0;font-variant-numeric:tabular-nums">${post.date}</span>`;
                        container.appendChild(row);
                    });
                });
        </script>
    </body>
</html>
